[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netranger-db"
version = "2.0.0"
description = "Database library for Network Ranger (bot and web)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Jason R. Rokeach" }
]
dependencies = [
    "aiomysql>=0.2.0",
    "PyMySQL>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
]

[project.scripts]
nrdb-migrate = "netranger_db.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["netranger_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
